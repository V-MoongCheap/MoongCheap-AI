apiVersion: batch/v1
kind: CronJob
metadata:
  name: demand-clustering-job
  labels:
    app.kubernetes.io/name: demand-clustering-job
    app.kubernetes.io/component: batch
    app.kubernetes.io/part-of: moongcheap-ai
spec:
  # Initial handoff values; infrastructure confirms the final schedule/deadlines.
  schedule: "45 * * * *"
  timeZone: Asia/Seoul
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: demand-clustering-job
            app.kubernetes.io/component: batch
            app.kubernetes.io/part-of: moongcheap-ai
        spec:
          # Infrastructure must label the shared BE/AI nodes; this creates no node group.
          nodeSelector:
            workload: backend-ai
            kubernetes.io/os: linux
            kubernetes.io/arch: amd64
          # No dedicated AI taint is assumed in the shared worker design.
          tolerations: []
          restartPolicy: Never
          serviceAccountName: demand-clustering-sa
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: demand-clustering-job
              image: demand-clustering-job:replace-with-git-sha
              imagePullPolicy: IfNotPresent
              command: ["demand-clustering-batch"]
              envFrom:
                - configMapRef:
                    name: demand-clustering-config
              env:
                - name: DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: backend-env
                      key: DB_URL
                - name: DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: backend-env
                      key: DB_USERNAME
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backend-env
                      key: DB_PASSWORD
                - name: BACKEND_INTERNAL_KEY
                  # Cloud must supply this missing backend-env key from the
                  # agreed SSM Parameter Store SecureString before unsuspending.
                  valueFrom:
                    secretKeyRef:
                      name: backend-env
                      key: MOONGCHEAP_INTERNAL_API_KEY
              resources:
                requests:
                  cpu: "1"
                  memory: 3Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
                  readOnly: true
                - name: e5-model
                  mountPath: /models/multilingual-e5-small
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            # Existing, populated claims in the same namespace; not provisioned here.
            - name: artifacts
              persistentVolumeClaim:
                claimName: demand-clustering-artifacts
                readOnly: true
            - name: e5-model
              persistentVolumeClaim:
                claimName: demand-clustering-e5-model
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
