apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cronjob.yaml
  - serviceaccount.yaml

# Non-secret settings only. Keep the generated name hash enabled.
configMapGenerator:
  - name: demand-clustering-config
    literals:
      - BACKEND_BASE_URL=https://backend.invalid
      - DEMAND_CATALOG_SEED_PATH=/artifacts/product_catalog_seed_v5.csv
      - DEMAND_TAXONOMY_PATH=/artifacts/taxonomy.json
      - DEMAND_CONSTRAINT_RULES_PATH=/app/config/demand_constraint_rules.json
      - DEMAND_CONSTRAINT_ALIASES_PATH=/app/config/model1_aliases_reviewed_v2.json
      - DEMAND_CONSTRAINT_COMPAT_ALIASES_PATH=/app/config/demand_constraint_aliases.json
      - E5_MODEL_PATH=/models/multilingual-e5-small
      - E5_BATCH_SIZE=32
      - CLUSTER_MIN_PARTICIPANTS=5
      - BACKEND_HTTP_TIMEOUT_SECONDS=15
      - POSTGRES_CONNECT_TIMEOUT_SECONDS=10
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HOME=/tmp/huggingface
