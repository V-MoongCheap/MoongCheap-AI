apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Part B only; do not move other AI components into the Cloud namespace.
resources:
  - ../../base/demand-clustering-job

# Matches Cloud develop's ApplicationSet; infrastructure provisions Secrets.
namespace: moongcheap-develop

# Backend Service in the same namespace: port 80 -> Pod port 8080.
configMapGenerator:
  - name: demand-clustering-config
    behavior: merge
    literals:
      - BACKEND_BASE_URL=http://backend

labels:
  - pairs:
      app.kubernetes.io/instance: demand-clustering-develop
    includeSelectors: false

# Keep the image placeholder and suspend=true until backend integration is ready.
