# Demand Clustering CI/CD Handoff (Part B)
# 실제 Secret 값은 작성하지 않습니다.

repository: https://github.com/V-MoongCheap/MoongCheap-AI
branch: develop

build_command: "uv sync --project packaging/demand-clustering --locked --extra data --extra dev"
test_command: "uv run --project packaging/demand-clustering --no-sync pytest -c packaging/demand-clustering/pyproject.toml"
manifest_test_command: "tools/verify_kubernetes_manifests.sh"
ci_tools: [uv, kubectl]  # 매니페스트 검사는 kubectl kustomize를 사용하며 클러스터 접속 없음
runtime_install_command: "uv sync --project packaging/demand-clustering --locked --no-dev --extra embeddings --no-editable"
runtime_command: "demand-clustering-batch"

dockerfile_path: docker/Dockerfile.demand-clustering
container_image_name: demand-clustering-job  # ECR repository 최종 명칭은 인프라 확인
container_build_command: "docker build -f docker/Dockerfile.demand-clustering -t demand-clustering-job:<git-sha> ."
container_architecture: linux/amd64  # 현재 검증 대상; EKS 노드 아키텍처 확인 필요
image_assets:
  source_path: packaging/demand-clustering/runtime-assets
  catalog_manifest: packaging/demand-clustering/runtime-assets/catalog.json
  model_manifest: packaging/demand-clustering/runtime-assets/model.json
  build_network: "패키지 registry와 Hugging Face에서 고정 버전 다운로드"
  runtime_download: false
  persistent_volumes_required: false
  offline_image_test: "docker run --rm -i --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --cap-drop ALL --security-opt no-new-privileges --entrypoint python demand-clustering-job:<git-sha> - < scripts/deployment/verify_demand_clustering_image.py"

kubernetes:
  base_path: k8s/base/demand-clustering-job
  dev_example_path: k8s/overlays/demand-clustering-dev
  documentation: k8s/README.md
  namespace_example: moongcheap-develop  # Cloud develop 57cd52e의 ApplicationSet 기준
  service_account_name: demand-clustering-sa  # Cloud 규약: {service-or-component}-sa
  schedule: "45 * * * *"  # 초기안
  time_zone: Asia/Seoul
  suspend: true
  concurrency_policy: Forbid
  successful_jobs_history_limit: 1
  failed_jobs_history_limit: 3
  backoff_limit: 0
  restart_policy: Never
  starting_deadline_seconds: 300
  active_deadline_seconds: 1800
  ttl_seconds_after_finished: 86400
  node_selector:
    workload: backend-ai
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  tolerations: []  # 공유 BE·AI Worker; 별도 taint 정책이 추가되면 함께 조정

helm:
  workload_kind: CronJob
  required_resources: [CronJob, ConfigMap, ServiceAccount]
  documentation: k8s/README.md
  status: "Cloud GitOps 차트에 이 실행 계약 반영 필요; 현재 AI 저장소는 Kustomize 기준 매니페스트 제공"

application_port: null  # 수요 클러스터링은 1회 실행 후 종료하는 배치
# Readiness/Liveness/Startup Probe, Deployment replica, Service/Ingress/HPA는 사용하지 않는다.
health_check_path: ""
metrics_path: ""

environment_variables:
  - name: BACKEND_BASE_URL
    purpose: "Backend HTTP(S) base URL"
    develop_value: http://backend  # 같은 moongcheap-develop의 Service 80 -> Pod 8080
  - name: MFDS_CATALOG_PROFILES_PATH
    purpose: "Part A 상품도감 ID 기준의 MFDS profile CSV; DB 입력도 같은 ID 사용"
  - name: DEMAND_TAXONOMY_PATH
    purpose: "배포 profile과 일치하는 taxonomy JSON"
  - name: DEMAND_CONSTRAINT_RULES_PATH
    purpose: "자연어 조건 규칙 JSON"
  - name: DEMAND_CONSTRAINT_ALIASES_PATH
    purpose: "선택 A 승인 별칭; 미설정이면 B-only, 경로를 설정한 뒤 파일 누락·읽기 실패·잘못된 버전·코드/값은 기동 차단"
  - name: DEMAND_CONSTRAINT_COMPAT_ALIASES_PATH
    purpose: "필수 B 기본 별칭; config/demand_constraint_aliases.json, A와 겹치는 표현만 A 우선"
  - name: E5_MODEL_PATH
    purpose: "로컬 CPU E5 모델 디렉터리"
  - name: E5_MODEL_REVISION
    purpose: "선택 모델 revision"
  - name: E5_BATCH_SIZE
    purpose: "선택 embedding batch size; 기본 32"
  - name: BACKEND_HTTP_TIMEOUT_SECONDS
    purpose: "선택 HTTP timeout; 기본 15초"
  - name: POSTGRES_CONNECT_TIMEOUT_SECONDS
    purpose: "선택 DB connect timeout; 기본 10초"
  - name: CLUSTER_MIN_PARTICIPANTS
    purpose: "Demand Clustering 신규 Board 생성 최소 참여자 수 (선택, 기본값: 5)"

secret_variables:
  - name: DB_URL
    purpose: "Backend JDBC URL; 앱에서 jdbc: 제거 후 계정·비밀번호와 PostgreSQL DSN으로 조합"
    secret_name: backend-env
    secret_key: DB_URL
  - name: DB_USERNAME
    purpose: "Backend와 공유하는 DB 계정; B는 읽기 전용 세션으로 연결"
    secret_name: backend-env
    secret_key: DB_USERNAME
  - name: DB_PASSWORD
    purpose: "DB 비밀번호; 앱에서 공백 보존 및 URL 인코딩"
    secret_name: backend-env
    secret_key: DB_PASSWORD
  - name: BACKEND_INTERNAL_KEY
    purpose: "합의한 X-Internal-Key 값; Parameter Store 원본을 배포 환경이 Pod 환경 변수로 주입"
    source:
      provider: aws-ssm-parameter-store
      type: SecureString
    injection_status: "Cloud develop 57cd52e에는 이 key가 없음; SSM 조회·동기화 및 backend-env 항목 공급 후 배포 가능"
    secret_name: backend-env
    secret_key: MOONGCHEAP_INTERNAL_API_KEY

database_configuration:
  explicit_dsn_override: SHARED_DATABASE_URL
  precedence: "비어 있지 않은 SHARED_DATABASE_URL이 DB_URL/DB_USERNAME/DB_PASSWORD보다 우선; JDBC 직접 주입 불가"
  shared_backend_account: true
  read_only_session: true
  create_new_database_secret: false

resources:
  requests:
    cpu: "1"
    memory: "3Gi"
  limits:
    cpu: "2"
    memory: "4Gi"
  gpu: false
  status: "초기 제안값; 구성요소 측정 조건과 한계는 docs/DEMAND_CLUSTERING_CONTAINER.md 참고"

runtime_filesystem:
  read_only_root: true
  run_as_user: 65534
  run_as_group: 65534
  writable_tmp: "/tmp (emptyDir, 초기 sizeLimit 256Mi)"
  read_only_mounts: []  # 외부 볼륨 없이 이미지 내부 파일 사용
  bundled_paths:
    - /artifacts/catalog_profiles.csv
    - /artifacts/taxonomy.json
    - /models/multilingual-e5-small

artifact_migration:
  required_before_v2_2_deploy: false
  reason: "검증된 V2.2 profile·taxonomy와 E5를 이미지에 포함; 외부 artifact 이관 없음"
  required_files: [catalog_profiles.csv, taxonomy.json]
  rollout: "B 담당자가 runtime-assets를 함께 갱신·검증하고 새 이미지 태그로 배포"
  image_only_rollout_supported: true

external_dependencies:
  - "Shared PostgreSQL (SELECT on demand, demand_board, reject_history)"
  - "Backend formation-plans and substitute-offer-plans APIs"
  - "Same-namespace backend-env with DB_URL, DB_USERNAME, DB_PASSWORD"
  - "AWS Parameter Store SecureString to backend-env/MOONGCHEAP_INTERNAL_API_KEY delivery by the deployment environment (not yet configured)"

notes: >-
  이 값들은 수요 클러스터링 배치 기준이다. 기본 CronJob과 dev 예시는 AI 저장소에서
  제공하며 실제 배포 설정의 기준은 인프라 GitOps 저장소다. 이미지 push, GitOps 갱신,
  ArgoCD/EKS 연결과 운영 배포는 인프라 측 작업이다. 내부 키의 Parameter Store 조회 권한과
  Pod 전달은 배포 환경이 담당하며 앱은 AWS API를 직접 호출하지 않는다.
  DB는 Backend 계정을 공유하며 기존 세 변수로 접속 URL을 조합한다. B의 DB 세션은
  읽기 전용으로 유지한다. backend-env에 내부 인증 키가 공급될 때까지 suspend=true를
  유지한다. Backend X-Internal-Api-Key와 AI X-Internal-Key의 헤더 불일치도 배포 전 해결한다.
  Kubernetes Secret을 거치지 않는 방식으로 확정되면 GitOps의 주입 설정을 함께 바꾼다.
  Namespace, Secret, Node Group 자체는 이 매니페스트가 생성하지 않는다. B는 PVC를 사용하지 않는다.
  실패한 요청은 저장하거나 재전송하지 않고 다음 정기 실행에서 DB를 새로 읽는다.
  CronJob은 concurrencyPolicy=Forbid, Job은 backoffLimit=0,
  Pod는 restartPolicy=Never로 설정해 실패한 배치를 즉시 재실행하지 않는다.
  과거 슬롯을 전달하는 --planned-at/--batch-id 옵션과 checkpoint 볼륨은 사용하지 않는다.
  모델은 이미지 빌드 시 고정 revision을 다운로드하고 파일별 SHA256을 검증한다.
  상품 profile·taxonomy는 저장소의 runtime-assets에서 가져와 이미지에 함께 넣는다.
  실행 시 외부 모델·데이터 다운로드나 PVC 공급이 필요하지 않다.
  workload=backend-ai 라벨은 인프라가 실제 노드에 제공해야 한다.
  Cloud develop 57cd52e의 be-ai NodePool은 workload=backend-ai, Linux amd64이며 taint가 없다.
  ArgoCD·Karpenter·Jenkins Controller용 system 노드는 별도다. BE·AI Worker의 Backend·
  다른 AI·노드별 시스템 Pod를 포함한 합산 자원 여유는 실제 클러스터에서 확인한다.
  이 매니페스트는 Node Group이나 노드 수를 정하지 않는다.
  B 배포는 전용 overlay 또는 Cloud의 B 전용 차트 중 하나만 사용한다.
  A도 포함하는 기존 공용 k8s/overlays/dev는 변경하지 않으며 B 전용 배포와 중복 적용하지 않는다.
