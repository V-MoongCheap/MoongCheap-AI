# CI/CD Application Handoff Template
# 실제 Secret 값은 작성하지 않습니다.

repository:
branch: develop

build_command: ""
test_command: ""

dockerfile_path: ""
container_image_name: ai-api

application_port: 8000
health_check_path: ""
metrics_path: ""

environment_variables:
  - name: CLUSTER_MIN_PARTICIPANTS
    purpose: "Demand Clustering 신규 Board 생성 최소 참여자 수 (선택, 기본값: 5)"

secret_variables:
  # 이름과 용도만 작성
  # - name: EXAMPLE_SECRET
  #   purpose: 설명

resources:
  cpu: ""
  memory: ""
  gpu: false

external_dependencies:
  # - PostgreSQL
  # - pgvector
  # - Redis
  # - LLM API

notes: "서비스별 실행 계약을 작성합니다. Part A labeling은 현재 PostgreSQL에서 미처리 demand를 조회하고 demand.label 및 demand.processed_at을 직접 UPDATE하는 CronJob이며, 모델 실행 위치와 Secret 공급 방식은 Cloud 배포 계약 확정 후 기입합니다."
