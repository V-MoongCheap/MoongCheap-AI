# Cloud `gitops/values/services/ai.yaml` 교체안 — 판매자 수요 분석 내부 API
#
# 지금 Cloud develop 의 같은 파일은 초기 틀이라 containerPort 가 8000 이다.
# 이 서비스 이미지는 docker/Dockerfile.seller-analysis 로 만들고 8081 에서만 듣는다.
# (`EXPOSE 8081`, uvicorn `--port 8081`. 환경 변수로 바꾸지 않는다.)

nameOverride: ai

image:
  repository: "840851421204.dkr.ecr.ap-northeast-2.amazonaws.com/moongcheap/ai"

containerPort: 8081          # ← 8000 에서 변경

service:
  port: 80                   # 80 → 컨테이너 8081

envFrom:
  - secretRef:
      name: ai-env           # externalsecret-ai.yaml 이 만든다

livenessProbe:
  enabled: false
  path: /health

readinessProbe:
  enabled: true              # ← false 에서 변경. GET /health 가 구현돼 있다
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

nodeSelector:
  workload: backend-ai

# 미측정값이다. backend 는 250m/512Mi~1/1Gi 를 쓴다. 공통 기본값(100m/128Mi~500m/512Mi)으로
# 시작해도 되는지, 첫 배포 후 실측해 조정할지는 인프라 판단에 맡긴다.
# resources:
#   requests: { cpu: 100m, memory: 256Mi }
#   limits:   { cpu: 500m, memory: 512Mi }

# ingress 는 켜지 않는다. 이 API 는 Backend 가 클러스터 내부에서만 호출한다.
# (HTTPRoute 도 만들지 않는다 — backend·frontend 와 다른 점이다.)
