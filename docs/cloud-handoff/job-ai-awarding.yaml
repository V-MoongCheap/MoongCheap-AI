# 낙찰 일회 배치 — Cloud `moongcheap-service` 차트에 Job/CronJob 템플릿이 없어서 따로 낸 안.
#
# ⛔ 이 파일을 그대로 적용하지 말고 먼저 읽어 주세요. 두 가지가 아직 정해지지 않았습니다.
#    1) 실행 주기 — 낙찰 명세는 1분 폴링을 전제하지만, 한 번 실행은 한 페이지(최대 100건)만 처리한다
#    2) `--send` 는 board·product·demand 상태를 바꾸고 공동구매를 만든다.
#       Backend 판정 조건 필드가 아직 없어 지금 붙이면 전건이 계약 오류가 된다 (2026-09-21 확인)
#
# 그래서 아래는 **전송하지 않는 dry-run** 으로 두었다. 실제 연동은 별도 승인 후 --send 를 붙인다.

apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-awarding
  namespace: moongcheap-develop
spec:
  schedule: "*/1 * * * *"          # 미확정. 인프라·Backend 와 합의 후 확정한다
  concurrencyPolicy: Forbid        # 같은 board 를 두 번 판정하지 않는다
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 30

  jobTemplate:
    spec:
      backoffLimit: 0              # ⛔ 자동 재시도하지 않는다. 상태를 바꾸는 요청이다
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            workload: backend-ai
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: awarding
              image: 840851421204.dkr.ecr.ap-northeast-2.amazonaws.com/moongcheap/ai-awarding:develop-<git-short-sha>
              imagePullPolicy: IfNotPresent
              args:
                - "--backend-url"
                - "http://backend"          # 클러스터 내부 Service 이름. 확인 필요
                - "--shipping-fee-unit"
                - "PER_BOARD"               # ⚠️ 시험값. PM 승인값 아님
                - "--price-cap-basis"
                - "UNIT_PRICE"              # ⚠️ 시험값. PM 승인값 아님
                # - "--send"                # 승인 전까지 붙이지 않는다
              envFrom:
                - secretRef:
                    name: ai-env
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}

# 종료 코드
#   0 정상 · 1 실행 실패 또는 결과 응답 계약 오류 · 2 키 없음
#   3 조회는 됐는데 한 건도 판정하지 못함 · 4 전송 후 반영되지 않은 board 가 있음
# backoffLimit: 0 이라 0 이 아닌 코드는 재실행 없이 실패로 남는다. 알림 연동은 인프라 확인 대기.
