# Cloud `gitops/platform/external-secrets/resources/` 에 추가할 안.
# external-secret-backend.yaml 과 같은 구조로 맞췄다.
#
# ⚠️ AWS Secrets Manager 의 키 이름(moongcheap-develop-ai-secret)은 제안이다.
#    실제 시크릿 생성과 이름은 인프라 소관이며, 값은 AI 파트가 이 문서에 적지 않는다.

apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: ai-env
  namespace: moongcheap-develop

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: ai-env
    creationPolicy: Owner

    template:
      engineVersion: v2
      data:
        # Backend → AI 내부 호출을 검증하는 키. 요청 헤더 X-Internal-Key 와 비교한다
        SELLER_ANALYSIS_INTERNAL_KEY: "{{ .SELLER_ANALYSIS_INTERNAL_KEY }}"
        # AI → Backend 낙찰 호출에 붙이는 키. 요청 헤더 X-Internal-Api-Key 로 나간다
        BACKEND_INTERNAL_API_KEY: "{{ .BACKEND_INTERNAL_API_KEY }}"

  dataFrom:
    - extract:
        key: moongcheap-develop-ai-secret
